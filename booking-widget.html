<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Бронирование — Гагарина, 57</title><style>body{margin:0;background:#f8f4ec;color:#163e48;font-family:Arial,sans-serif}#hr-widget{min-height:360px}.booking-page-header,.booking-page-intro{display:none}@media(max-width:700px){.booking-page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fffdf9;border-bottom:1px solid #e1e7e4;gap:12px}.booking-page-header a{color:#163e48;text-decoration:none;font-size:14px;font-weight:700}.booking-page-header strong{font:20px Georgia,serif}.booking-page-intro{padding:20px 16px 12px;text-align:center}.booking-page-intro h1{font:normal 30px Georgia,serif;margin:0 0 8px}.booking-page-intro p{font-size:14px;line-height:1.5;margin:0;color:#46646b}#hr-widget{min-height:420px;padding:0 8px 20px}}</style></head><body><header class="booking-page-header"><a href="/#booking">← На сайт</a><strong>Гагарина, 57</strong></header><div class="booking-page-intro"><h1>Выберите даты</h1><p>Апартаменты в Зеленоградске · от 6 000 ₽ за сутки</p></div><div id="hr-widget"></div><script type="module" src="https://homereserve.ru/widget.js"></script><script type="module">window.homereserve.initWidgetList({"token":"Xq1yLlGXgE"})</script><script>
(function(){
 let last=0;
 function report(){
  const content=document.getElementById('hr-widget');
  const height=Math.ceil(Math.max(360,content.scrollHeight,content.getBoundingClientRect().height));
  if(Math.abs(height-last)>3){last=height;parent.postMessage({type:'gagarina57:booking-height',height:height},location.origin);}
 }
 const observer=new ResizeObserver(report);
 observer.observe(document.body);
 observer.observe(document.getElementById('hr-widget'));
 const changes=new MutationObserver(report);
 changes.observe(document.getElementById('hr-widget'),{childList:true,subtree:true,attributes:true});
 window.addEventListener('load',report);
 setInterval(report,2500);
 report();
})();
</script></body></html>
